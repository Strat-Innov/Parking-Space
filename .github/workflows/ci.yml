name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parkspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway service container — the suite truncates every table between
      # tests. Deliberately not DATABASE_URL, so nothing can point at a real
      # database by accident.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parkspace_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to the test database
        run: npm run test:db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
